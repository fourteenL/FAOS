[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faos-app"
version = "0.1.0"
description = "FAOS 期货差价套利交易软件 - pytauri 后端"
requires-python = ">=3.13"
dependencies = [
    "pytauri==0.8.*",
    "pydantic==2.*",
    "anyio==4.*",
]

[tool.setuptools.packages.find]
where = ["python"]
